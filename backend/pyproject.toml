[project]
name = "kp-backend"
version = "0.1.0"
description = "KP — NSE Market Intelligence Platform Backend"
requires-python = ">=3.12"
authors = [{ name = "KP Team" }]
license = { text = "Proprietary" }

dependencies = [
    # ---- Web Framework ------------------------------------
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",

    # ---- Database -----------------------------------------
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",

    # ---- Redis --------------------------------------------
    "redis[hiredis]>=5.2.0",

    # ---- Data Validation ----------------------------------
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # ---- Security -----------------------------------------
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",            # passlib 1.7.4 is incompatible with bcrypt>=5
    "cryptography>=43.0.0",

    # ---- Email / Timezone ---------------------------------
    "pydantic[email]>=2.10.0",  # email-validator for EmailStr
    "email-validator>=2.3.0",
    "tzdata>=2024.1",           # Windows zoneinfo support

    # ---- HTTP Client --------------------------------------
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",

    # ---- Market Data Providers ----------------------------
    "yfinance>=0.2.48",
    "nsepython>=2.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pytz>=2024.1",

    # ---- Scheduling / Background Tasks --------------------
    "apscheduler>=3.10.4",
    "celery>=5.4.0",

    # ---- Logging / Observability -------------------------
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",

    # ---- Utilities ----------------------------------------
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "shap>=0.46.0",
]
deep-learning = [
    "torch>=2.5.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
kp = "scripts.kp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["backend"]
omit = ["*/tests/*", "*/migrations/*"]
