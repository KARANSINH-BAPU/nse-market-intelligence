# Alembic Configuration for KP
# This file is read by Alembic CLI and the migration env.
# The actual connection URL comes from the .env file, not here.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
version_locations = %(here)s/migrations/versions

# Do NOT hard-code database_url here. It is injected from settings in env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
