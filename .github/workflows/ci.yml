name: KP CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: migration + integration tests ────────────────────────────────
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine        # standard PG17 — TimescaleDB not needed
        env:
          POSTGRES_USER:     kp_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB:       kp_test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://kp_user:test_password@localhost:5432/kp_test_db
      REDIS_URL:    redis://localhost:6379/0
      SECRET_KEY:   ci_test_secret_key_64_chars_minimum_required_for_jwt_signing_ok
      JWT_SECRET:   ci_test_jwt_secret_64_chars_minimum_required_for_jwt_signing_here
      ENVIRONMENT:  test
      PYTHONPATH:   backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --no-dev

      - name: Install test dependencies
        run: |
          pip install \
            pytest httpx asyncpg yfinance \
            structlog pydantic fastapi uvicorn sqlalchemy \
            alembic passlib[bcrypt] python-jose[cryptography] \
            email-validator tzdata

      - name: Enable uuid-ossp extension
        run: |
          PGPASSWORD=test_password psql \
            -h localhost -U kp_user -d kp_test_db \
            -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"

      - name: Run Alembic migrations
        run: |
          python -m alembic upgrade head
        working-directory: ${{ github.workspace }}

      - name: Start backend server
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for backend..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
        working-directory: backend

      - name: Run integration tests (fast — skip yfinance)
        run: |
          python -m pytest tests/integration/test_api.py \
            -k "not snapshot and not ohlcv" \
            -v --tb=short
        env:
          PYTHONPATH: backend

  # ── Frontend: build ───────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL:  ws://localhost:8000/ws
        run: npm run build

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        working-directory: backend
        run: ruff check . --output-format=github
        continue-on-error: true   # informational only for now

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npx eslint . --max-warnings=50
        continue-on-error: true
