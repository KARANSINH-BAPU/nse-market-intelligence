name: KP CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: kp_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: kp_test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: backend
        run: uv sync --no-dev

      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://kp_user:test_password@localhost:5432/kp_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_test_secret_key_64chars_required_for_security_minimum
          JWT_SECRET: ci_test_jwt_secret_64chars_required_for_security_minimum_len
          ENVIRONMENT: test
        run: uv run pytest ../tests/unit/ -v --tb=short

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
        run: npm run build

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv + dev tools
        run: pip install uv

      - name: Install all dependencies
        working-directory: backend
        run: uv sync

      - name: Run ruff
        working-directory: backend
        run: uv run ruff check . --output-format=github

      - name: Run mypy
        working-directory: backend
        run: uv run mypy app/ --ignore-missing-imports
        continue-on-error: true  # Not blocking initially
